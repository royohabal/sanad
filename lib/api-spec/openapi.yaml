openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SANAD demo tipping and family-finance prototype API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sanad
    description: SANAD demo application
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: MongoDB is unavailable
  /auth/me:
    get:
      operationId: getSanadSession
      tags: [sanad]
      summary: Get the signed-in SANAD account role
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProfile"
        "401":
          description: Sign-in required
  /auth/bootstrap-admin:
    post:
      operationId: bootstrapFirstAdmin
      tags: [sanad]
      summary: Claim the initial admin role for the allowlisted signed-in account
      security:
        - ClerkSession: []
      responses:
        "201":
          description: Initial admin role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProfile"
        "200":
          description: Account already has the admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProfile"
        "401":
          description: Sign-in required
        "403":
          description: Signed-in account is not the allowlisted first admin
        "409":
          description: Initial admin role was already claimed
        "503":
          description: Initial admin email is not configured or identity verification failed
  /workers/me/profile:
    get:
      operationId: getMyWorkerProfile
      tags: [sanad]
      summary: Get the signed-in user's worker profile and company request state
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Owned worker profile, if registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerProfileState"
        "401":
          description: Sign-in required
    post:
      operationId: createMyWorkerProfile
      tags: [sanad]
      summary: Register the signed-in user as a worker
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerProfileInput"
      responses:
        "201":
          description: Worker account profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerProfileState"
        "400":
          description: Invalid profile details
        "401":
          description: Sign-in required
        "409":
          description: Worker profile already exists
  /workers/me/dashboard:
    get:
      operationId: getMyWorkerDashboard
      tags: [sanad]
      summary: Get the signed-in worker's private dashboard
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Owner-only tip and settlement overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDashboard"
        "401":
          description: Sign-in required
        "404":
          description: Worker profile not found
  /workers/me/wallet/demo-payout:
    put:
      operationId: updateWorkerDemoPayoutProfile
      tags: [sanad]
      summary: Save non-sensitive demo payout details for the signed-in worker
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoPayoutProfileInput"
      responses:
        "200":
          description: Demo-only payout profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoPayoutProfileResponse"
        "400":
          description: Invalid demo payout profile
        "401":
          description: Sign-in required
        "404":
          description: Worker profile not found
  /workers/me/wallet/legacy-tip-route:
    post:
      operationId: assignLegacyWorkerTips
      tags: [sanad]
      summary: Explicitly assign older tips whose original payout method was not recorded
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyTipRouteInput"
      responses:
        "200":
          description: Legacy tips assigned using the worker's explicit choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyTipRouteResponse"
        "400":
          description: Invalid payout route
        "401":
          description: Sign-in required
        "404":
          description: Worker profile not found
        "409":
          description: Company route requires an approved company association
  /workers/me/wallet/transactions:
    get:
      operationId: getWorkerWalletTransactions
      tags: [sanad]
      summary: List the signed-in worker's persistent wallet ledger
      security:
        - ClerkSession: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Worker-owned ledger page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerWalletTransactionsPage"
        "401":
          description: Sign-in required
        "404":
          description: Worker profile not found
  /workers/me/withdrawals:
    post:
      operationId: createWorkerWithdrawal
      tags: [sanad]
      summary: Request a simulated withdrawal against the worker's available tip balance
      description: No bank transfer or real payment is initiated.
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerWithdrawalInput"
      responses:
        "201":
          description: Withdrawal request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerWithdrawal"
        "200":
          description: Existing request returned for a safely retried submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerWithdrawal"
        "400":
          description: Invalid amount or request
        "401":
          description: Sign-in required
        "404":
          description: Worker profile not found
        "409":
          description: Insufficient available balance or duplicate key conflict
  /workers/me/withdrawals/{id}/cancel:
    post:
      operationId: cancelWorkerWithdrawal
      tags: [sanad]
      summary: Cancel the signed-in worker's pending withdrawal request
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Withdrawal cancelled and reservation released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerWithdrawal"
        "401":
          description: Sign-in required
        "404":
          description: Withdrawal not found for this worker
        "409":
          description: Withdrawal is no longer cancellable
  /workers/me/company-exit:
    post:
      operationId: leaveWorkerCompany
      tags: [sanad]
      summary: End the signed-in worker's current company association
      description: Preserves historical tips and statements; only future tips use the independent route.
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Company association ended without moving prior tips
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerProfileState"
        "401":
          description: Sign-in required
        "404":
          description: Worker profile not found
        "409":
          description: Worker has no active company association
  /workers/me/company-requests:
    post:
      operationId: createWorkerCompanyRequest
      tags: [sanad]
      summary: Request association with an approved company
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCompanyRequestInput"
      responses:
        "201":
          description: Company association request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerCompanyRequest"
        "400":
          description: Invalid company
        "401":
          description: Sign-in required
        "404":
          description: Worker or company not found
        "409":
          description: Worker already has a company request or association
  /companies/approved:
    get:
      operationId: listApprovedCompanies
      tags: [sanad]
      summary: List approved companies available for worker association
      responses:
        "200":
          description: Public company names only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyOption"
  /companies/me/profile:
    get:
      operationId: getMyCompanyProfile
      tags: [sanad]
      summary: Get the signed-in user's company account
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Owned company profile, if registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfileState"
        "401":
          description: Sign-in required
    post:
      operationId: createMyCompanyProfile
      tags: [sanad]
      summary: Register a company account pending SANAD review
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyProfileInput"
      responses:
        "201":
          description: Company account created with pending status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "400":
          description: Invalid company details
        "401":
          description: Sign-in required
        "409":
          description: This account already owns a company profile
  /companies/me/dashboard:
    get:
      operationId: getMyCompanyDashboard
      tags: [sanad]
      summary: Get the signed-in company's authorized worker summaries and reports
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Company-scoped dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDashboard"
        "401":
          description: Sign-in required
        "404":
          description: Company profile not found
  /companies/me/settlements:
    post:
      operationId: createCompanySettlements
      tags: [sanad]
      summary: Create itemized monthly demo statements for workers in the signed-in company
      description: Company tip amounts are calculated from eligible, unsettled tip records; no payroll payment is processed.
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettlementBatchInput"
      responses:
        "201":
          description: New company settlement statements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Settlement"
        "400":
          description: Invalid month or line items
        "401":
          description: Sign-in required
        "403":
          description: Approved company access required
        "404":
          description: Company profile not found
        "409":
          description: A worker already has a statement for this company and month
  /companies/me/settlements/{id}:
    patch:
      operationId: updateCompanySettlement
      tags: [sanad]
      summary: Review a demo settlement for the signed-in company
      description: Status changes are recorded for demonstration only and do not pay workers.
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettlementStatusInput"
      responses:
        "200":
          description: Updated company-scoped settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlement"
        "400":
          description: Invalid status transition
        "401":
          description: Sign-in required
        "403":
          description: Approved company access required
        "404":
          description: Settlement not found for this company
        "409":
          description: Settlement is no longer in a reviewable state
  /admin/worker-withdrawals:
    get:
      operationId: listAdminWorkerWithdrawals
      tags: [sanad]
      summary: List worker withdrawal requests for administrators
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Worker withdrawal requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminWorkerWithdrawal"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /admin/worker-withdrawals/{id}:
    patch:
      operationId: updateAdminWorkerWithdrawal
      tags: [sanad]
      summary: Process a simulated worker withdrawal
      description: Only an authorized admin can mark a request paid; this does not move money.
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWorkerWithdrawalStatusInput"
      responses:
        "200":
          description: Updated simulated withdrawal request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWorkerWithdrawal"
        "400":
          description: Invalid status transition
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Withdrawal not found
        "409":
          description: Withdrawal is no longer in a reviewable state
  /companies/me/worker-requests/{id}:
    patch:
      operationId: reviewWorkerCompanyRequest
      tags: [sanad]
      summary: Approve or reject a worker's association request
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyWorkerRequestUpdate"
      responses:
        "200":
          description: Association request reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyWorkerRequest"
        "400":
          description: Invalid request
        "401":
          description: Sign-in required
        "403":
          description: Company has not been approved
        "404":
          description: Request not found for this company
        "409":
          description: Request is no longer pending
  /companies/me/workers:
    get:
      operationId: listCompanyWorkers
      tags: [sanad]
      summary: List only workers and invitations owned by the signed-in approved company
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Company-scoped worker roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyManagedWorker"
        "401":
          description: Sign-in required
        "403":
          description: Approved company access is required
        "404":
          description: Company profile not found
    post:
      operationId: createCompanyWorkerInvitation
      tags: [sanad]
      summary: Create a company-owned worker profile and email a Clerk invitation
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyWorkerCreateInput"
      responses:
        "201":
          description: Worker profile and email invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyManagedWorker"
        "400":
          description: Invalid worker details or invitation redirect
        "401":
          description: Sign-in required
        "403":
          description: Approved company access is required
        "404":
          description: Company profile not found
        "409":
          description: Worker or email already belongs to another active invitation
        "502":
          description: Clerk could not send the invitation email
  /companies/me/workers/{workerId}:
    patch:
      operationId: updateCompanyWorker
      tags: [sanad]
      summary: Update a worker profile owned by the signed-in company
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: workerId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyWorkerUpdateInput"
      responses:
        "200":
          description: Updated company worker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyManagedWorker"
        "400":
          description: Invalid profile details
        "401":
          description: Sign-in required
        "403":
          description: Approved company access is required
        "404":
          description: Worker not found for this company
  /companies/me/workers/{workerId}/resend-invitation:
    post:
      operationId: resendCompanyWorkerInvitation
      tags: [sanad]
      summary: Send a fresh Clerk invitation to a pending company worker
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: workerId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerInvitationRedirectInput"
      responses:
        "200":
          description: Fresh email invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyManagedWorker"
        "400":
          description: Invalid invitation redirect
        "401":
          description: Sign-in required
        "403":
          description: Approved company access is required
        "404":
          description: Pending worker not found
        "409":
          description: Worker is already active or has no resubmittable invitation
        "502":
          description: Clerk could not send the invitation email
  /companies/me/workers/{workerId}/revoke-invitation:
    post:
      operationId: revokeCompanyWorkerInvitation
      tags: [sanad]
      summary: Revoke a pending worker invitation without deleting the worker profile
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: workerId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Invitation revoked; profile and history retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyManagedWorker"
        "401":
          description: Sign-in required
        "403":
          description: Approved company access is required
        "404":
          description: Pending worker not found
        "409":
          description: No pending invitation can be revoked
        "502":
          description: Clerk could not revoke the invitation
  /companies/me/workers/{workerId}/deactivate:
    post:
      operationId: deactivateCompanyWorker
      tags: [sanad]
      summary: Deactivate a worker and disable new QR tips while preserving their history
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: workerId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Worker deactivated without deleting financial history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyManagedWorker"
        "401":
          description: Sign-in required
        "403":
          description: Approved company access is required
        "404":
          description: Worker not found for this company
        "409":
          description: Worker is not active
  /workers/me/invitation:
    get:
      operationId: getMyWorkerInvitation
      tags: [sanad]
      summary: Find the signed-in user's pending company worker invitation
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Invitation matching the signed-in verified email, if one exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyWorkerInvitationResponse"
        "401":
          description: Sign-in required
  /workers/me/accept-invitation:
    post:
      operationId: acceptMyWorkerInvitation
      tags: [sanad]
      summary: Accept an invitation using the verified Clerk email that received it
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Company worker profile activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerProfileState"
        "401":
          description: Sign-in required
        "403":
          description: Sign in through the newest Clerk invitation email
        "404":
          description: No current invitation matches the signed-in account
        "409":
          description: The worker or company is no longer eligible
        "410":
          description: Invitation expired or was revoked
  /admin/companies:
    get:
      operationId: listPendingCompanies
      tags: [sanad]
      summary: List companies awaiting administrator review
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Pending company applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyProfile"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /admin/companies/{id}:
    patch:
      operationId: reviewCompany
      tags: [sanad]
      summary: Approve or reject a pending company account
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyStatusUpdate"
      responses:
        "200":
          description: Company review updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "400":
          description: Invalid status
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Company not found
        "409":
          description: Company is no longer pending
  /workers:
    get:
      operationId: listWorkers
      tags: [sanad]
      summary: List workers
      responses:
        "200":
          description: Worker directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"
    post:
      operationId: createWorker
      tags: [sanad]
      summary: Register a demo worker
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerInput"
      responses:
        "201":
          description: Registered worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /workers/{publicId}:
    get:
      operationId: getWorkerByPublicId
      tags: [sanad]
      summary: Look up a worker using their public QR identifier
      parameters:
        - in: path
          name: publicId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public worker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWorker"
        "404":
          description: Worker not found
    delete:
      operationId: deleteWorker
      tags: [sanad]
      summary: Archive a demo worker without deleting financial history
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: publicId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Worker archived and public QR access disabled; records retained
        "404":
          description: Worker not found
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /workers/{publicId}/dashboard:
    get:
      operationId: getWorkerDashboard
      tags: [sanad]
      summary: Get owner-only worker tip and settlement overview
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: publicId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Worker dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDashboard"
        "404":
          description: Worker not found
        "401":
          description: Sign-in required
        "403":
          description: Worker ownership required
  /tips:
    get:
      operationId: listTips
      tags: [sanad]
      summary: List simulated tips for administrator review
      description: Tip history is private to workers and administrators. Workers use their owner-only dashboard.
      security:
        - ClerkSession: []
      parameters:
        - in: query
          name: publicId
          schema:
            type: string
      responses:
        "200":
          description: Tips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tip"
    post:
      operationId: deprecatedCreateDirectTip
      tags: [sanad]
      summary: Deprecated direct tip write
      description: Direct tip writes are disabled. Start a shared checkout instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoTipInput"
      responses:
        "410":
          description: Direct tip creation is disabled; use the shared payment checkout
  /tips/{reference}:
    get:
      operationId: getTipReceipt
      tags: [sanad]
      summary: Retrieve a demo receipt
      parameters:
        - in: path
          name: reference
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Demo receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tip"
        "404":
          description: Receipt not found
  /companies/summary:
    get:
      operationId: getCompanySummary
      tags: [sanad]
      summary: Get platform worker totals for administrators
      description: Administrators only; requests from signed-in non-admin users are forbidden.
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Company summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySummary"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
  /settlements:
    get:
      operationId: listSettlements
      tags: [sanad]
      summary: List monthly demo settlements
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Settlement history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Settlement"
    post:
      operationId: createMonthlySettlements
      tags: [sanad]
      summary: Create current-month pending settlement records
      security:
        - ClerkSession: []
      responses:
        "201":
          description: Created or existing monthly settlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Settlement"
        "409":
          description: Legacy platform-wide generation is disabled; use company statements
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /settlements/{id}:
    patch:
      operationId: updateSettlementStatus
      tags: [sanad]
      summary: Simulate a settlement status update
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementStatusInput"
      responses:
        "200":
          description: Updated simulated settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlement"
        "404":
          description: Settlement not found
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [sanad]
      summary: Get demo platform overview
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /children:
    get:
      operationId: listChildren
      tags: [sanad]
      summary: List child profiles belonging to the signed-in parent
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Child profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Child"
    post:
      operationId: createChild
      tags: [sanad]
      summary: Create a demo child profile
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildInput"
      responses:
        "201":
          description: Child profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "401":
          description: Sign-in required
  /child-recipients/{publicId}:
    get:
      operationId: getPublicChildRecipient
      tags: [sanad]
      summary: Look up a child by their public QR identifier
      parameters:
        - in: path
          name: publicId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Limited public recipient profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicChildRecipient"
        "404":
          description: Child not found
        "429":
          description: Public child lookup rate limit exceeded
  /child-recipients/{publicId}/transfers:
    post:
      operationId: deprecatedCreatePublicChildTransfer
      tags: [sanad]
      summary: Deprecated direct child QR credit
      description: Direct QR credits are disabled; start a shared checkout instead.
      parameters:
        - in: path
          name: publicId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicChildTransferInput"
      responses:
        "410":
          description: Direct QR credits are disabled; use the shared payment checkout
  /children/{id}:
    patch:
      operationId: updateChild
      tags: [sanad]
      summary: Update a demo child's spending limit
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildUpdate"
      responses:
        "200":
          description: Updated child profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "404":
          description: Child profile not found
        "401":
          description: Sign-in required
        "403":
          description: Child profile is not accessible to this account
  /children/{id}/dashboard:
    get:
      operationId: getChildDashboard
      tags: [sanad]
      summary: Get child wallet, activity, goals, and approvals
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Child dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildDashboard"
        "404":
          description: Child not found
        "401":
          description: Sign-in required
        "403":
          description: Child profile is not accessible to this account
  /children/{id}/cash-outs:
    post:
      operationId: createCashOutRequest
      tags: [sanad]
      summary: Request a simulated child wallet cash-out
      description: Reserves available demo wallet balance. No funds are paid out.
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashOutRequestInput"
      responses:
        "201":
          description: Pending cash-out request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashOutRequest"
        "400":
          description: Invalid request
        "401":
          description: Sign-in required
        "403":
          description: Child profile is not accessible to this account
        "404":
          description: Child profile not found
        "409":
          description: Insufficient available balance or wallet conflict
  /cash-outs/{id}:
    patch:
      operationId: updateCashOutRequest
      tags: [sanad]
      summary: Approve or reject a pending cash-out request
      description: Approval does not transfer funds. Paid status cannot be set until a real payout is implemented.
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashOutRequestStatusInput"
      responses:
        "200":
          description: Updated cash-out request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashOutRequest"
        "400":
          description: Invalid decision
        "401":
          description: Sign-in required
        "403":
          description: Child profile is not accessible to this account
        "404":
          description: Cash-out request not found
        "409":
          description: Request is no longer pending or wallet reservation conflict
  /children/{id}/allowances:
    post:
      operationId: createAllowance
      tags: [sanad]
      summary: Record a simulated allowance or Eidiyah
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowanceInput"
      responses:
        "201":
          description: Demo allowance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildActivity"
        "404":
          description: Child not found
        "401":
          description: Sign-in required
        "403":
          description: Child profile is not accessible to this account
  /children/{id}/goals:
    post:
      operationId: createSavingsGoal
      tags: [sanad]
      summary: Add a savings goal
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsGoalInput"
      responses:
        "201":
          description: Savings goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsGoal"
        "404":
          description: Child not found
  /children/{id}/goals/{goalId}/contributions:
    post:
      operationId: contributeToSavingsGoal
      tags: [sanad]
      summary: Record a simulated goal contribution
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: goalId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalContributionInput"
      responses:
        "200":
          description: Updated savings goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsGoal"
        "404":
          description: Child or goal not found
        "401":
          description: Sign-in required
        "403":
          description: Child profile is not accessible to this account
  /children/{id}/approvals:
    post:
      operationId: createApprovalRequest
      tags: [sanad]
      summary: Submit a demo purchase approval request
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "201":
          description: Approval request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "404":
          description: Child not found
        "401":
          description: Sign-in required
        "403":
          description: Child profile is not accessible to this account
  /approvals/{id}:
    patch:
      operationId: updateApprovalRequest
      tags: [sanad]
      summary: Simulate a parent approval decision
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalStatusInput"
      responses:
        "200":
          description: Updated approval request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "404":
          description: Approval request not found
        "401":
          description: Sign-in required
        "403":
          description: Child profile is not accessible to this account
  /payments/checkout:
    post:
      operationId: createPaymentCheckout
      tags: [sanad]
      summary: Start a payment or explicitly simulated checkout
      description: Worker tips, child QR transfers, parent child-wallet top-ups, and personal-wallet top-ups use this checkout. Parent and personal wallet flows require sign-in. Stripe is test-mode only; unavailable Stripe test checkout uses an explicitly simulated checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCheckoutInput"
      responses:
        "201":
          description: Checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCheckout"
        "400":
          description: Invalid payment details
        "401":
          description: Sign-in required for wallet top-ups
        "404":
          description: Recipient not found or not accessible
        "409":
          description: Idempotency key reused with different details
        "429":
          description: Checkout rate limit exceeded
  /payments/{paymentId}:
    get:
      operationId: getPaymentCheckout
      tags: [sanad]
      summary: Read limited checkout status
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Checkout status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCheckout"
        "404":
          description: Checkout not found or not accessible
  /payments/{paymentId}/complete-simulated:
    post:
      operationId: completeSimulatedPayment
      tags: [sanad]
      summary: Explicitly complete a simulated checkout
      description: This can only complete a record whose provider is simulated. It never marks a Stripe checkout as paid.
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Simulated checkout result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCheckout"
        "404":
          description: Checkout not found or not accessible
        "409":
          description: Checkout is not simulated or is no longer pending
  /payments/{paymentId}/verify:
    post:
      operationId: verifyStripeCheckout
      tags: [sanad]
      summary: Verify a Stripe test Checkout Session on the server
      description: SANAD retrieves the session using its server-only Stripe test key and credits only after Stripe confirms a paid session with matching amount, currency, and metadata.
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyStripeCheckoutInput"
      responses:
        "200":
          description: Verified checkout result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCheckout"
        "400":
          description: Invalid Checkout Session identifier
        "404":
          description: Checkout not found or not accessible
        "409":
          description: Stripe has not confirmed a matching successful payment
  /payments/{paymentId}/cancel:
    post:
      operationId: cancelPaymentCheckout
      tags: [sanad]
      summary: Cancel an incomplete checkout
      description: Stripe sessions are expired server-side before the SANAD record is cancelled. A completed paid session is verified instead.
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Checkout cancellation or completed result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCheckout"
        "404":
          description: Checkout not found or not accessible
        "409":
          description: Checkout could not be safely cancelled
  /wallet:
    get:
      operationId: getWalletDashboard
      tags: [sanad]
      summary: Read the signed-in personal wallet and private activity
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Personal wallet, transactions, and requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletDashboard"
        "401":
          description: Sign-in required
  /wallet/recipients:
    get:
      operationId: lookupWalletRecipient
      tags: [sanad]
      summary: Resolve a SANAD recipient by exact account email
      description: Requires sign-in and returns only a safe display name and account identifier. The email is used server-side and is not returned.
      security:
        - ClerkSession: []
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: Matching account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletRecipient"
        "401":
          description: Sign-in required
        "404":
          description: No matching SANAD account
        "429":
          description: Recipient lookup rate limit exceeded
  /wallet/transfers:
    post:
      operationId: createWalletTransfer
      tags: [sanad]
      summary: Transfer balance between signed-in SANAD wallets
      description: Internal ledger transfer, not a card payment. Both participants receive private transaction history.
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletTransferInput"
      responses:
        "201":
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransaction"
        "400":
          description: Invalid transfer details
        "401":
          description: Sign-in required
        "404":
          description: Recipient account not found
        "409":
          description: Insufficient funds or idempotency conflict
  /wallet/requests:
    post:
      operationId: createWalletMoneyRequest
      tags: [sanad]
      summary: Request money from a signed-in SANAD account
      description: Creating a request does not move money. The recipient must explicitly pay it from their SANAD wallet.
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletMoneyRequestInput"
      responses:
        "201":
          description: Pending money request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletMoneyRequest"
        "400":
          description: Invalid request details
        "401":
          description: Sign-in required
        "404":
          description: Recipient account not found
        "409":
          description: Idempotency conflict
  /wallet/requests/{requestId}/action:
    post:
      operationId: actOnWalletMoneyRequest
      tags: [sanad]
      summary: Pay, decline, or cancel a pending money request
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletMoneyRequestActionInput"
      responses:
        "200":
          description: Updated money request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletMoneyRequest"
        "400":
          description: Invalid action
        "401":
          description: Sign-in required
        "404":
          description: Request not found or not accessible
        "409":
          description: Request is no longer pending or wallet has insufficient funds
  /demo-transfers:
    get:
      operationId: listDemoTransfers
      tags: [sanad]
      summary: List legacy public demo entries for administrators
      description: Historical records are retained; new private activity is available only through GET /wallet.
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Demo transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoTransfer"
        "429":
          description: Public transfer history rate limit exceeded
    post:
      operationId: deprecatedCreateDemoTransfer
      tags: [sanad]
      summary: Deprecated unauthenticated transfer write
      description: New person-to-person actions require signed-in SANAD wallets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoTransferInput"
      responses:
        "410":
          description: Public demo transfer writes are disabled
components:
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    AuthProfile:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        role: { type: string, enum: [parent, admin] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PublicWorker:
      type: object
      required: [publicId, name, workplace, jobTitle, company, createdAt]
      properties:
        publicId: { type: string }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        workplace: { type: string }
        jobTitle: { type: string }
        company: { type: string }
        createdAt: { type: string, format: date-time }
    Worker:
      type: object
      required: [id, publicId, name, workplace, jobTitle, company, createdAt]
      properties:
        id: { type: integer }
        publicId: { type: string }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        workplace: { type: string }
        jobTitle: { type: string }
        company: { type: string }
        createdAt: { type: string, format: date-time }
    WorkerInput:
      type: object
      required: [name, workplace, jobTitle, company]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        avatarUrl: { type: ["string", "null"], maxLength: 2048 }
        workplace: { type: string, minLength: 2, maxLength: 120 }
        jobTitle: { type: string, minLength: 2, maxLength: 80 }
        company: { type: string, minLength: 2, maxLength: 120 }
    WorkerProfileInput:
      type: object
      required: [name, workplace, jobTitle]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        workplace: { type: string, minLength: 2, maxLength: 120 }
        jobTitle: { type: string, minLength: 2, maxLength: 80 }
    WorkerProfileState:
      type: object
      required: [worker, companyStatus, companyRequest, accountStatus]
      properties:
        worker:
          oneOf:
            - $ref: "#/components/schemas/Worker"
            - type: "null"
        companyStatus:
          type: string
          enum: [none, pending, approved, rejected]
        accountStatus:
          type: string
          enum: [none, invited, active, deactivated]
        companyRequest:
          oneOf:
            - $ref: "#/components/schemas/WorkerCompanyRequest"
            - type: "null"
    CompanyProfile:
      type: object
      required: [id, name, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompanyProfileState:
      type: object
      required: [company]
      properties:
        company:
          oneOf:
            - $ref: "#/components/schemas/CompanyProfile"
            - type: "null"
    CompanyProfileInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
    WorkerInvitationRedirectInput:
      type: object
      properties:
        redirectPath:
          type: string
          pattern: "^/(?:[A-Za-z0-9_-]+/)?worker/invitation$"
          maxLength: 100
    CompanyWorkerCreateInput:
      allOf:
        - $ref: "#/components/schemas/WorkerInvitationRedirectInput"
        - type: object
          required: [name, emailAddress]
          properties:
            name: { type: string, minLength: 2, maxLength: 100 }
            emailAddress: { type: string, format: email, maxLength: 254 }
            jobTitle: { type: ["string", "null"], maxLength: 80 }
            department: { type: ["string", "null"], maxLength: 80 }
    CompanyWorkerUpdateInput:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        jobTitle: { type: ["string", "null"], maxLength: 80 }
        department: { type: ["string", "null"], maxLength: 80 }
    CompanyManagedWorker:
      type: object
      required: [workerId, publicId, name, emailAddress, workplace, jobTitle, department, status, invitationStatus, invitationExpiresAt, createdAt]
      properties:
        workerId: { type: integer }
        publicId: { type: string }
        name: { type: string }
        emailAddress: { type: ["string", "null"], format: email }
        workplace: { type: string }
        jobTitle: { type: string }
        department: { type: ["string", "null"] }
        status: { type: string, enum: [invited, active, deactivated] }
        invitationStatus:
          type: ["string", "null"]
          enum: [pending, accepted, expired, revoked, null]
        invitationExpiresAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    MyWorkerInvitationPreview:
      type: object
      required: [workerName, jobTitle, companyName, invitationExpiresAt]
      properties:
        workerName: { type: string }
        jobTitle: { type: string }
        companyName: { type: string }
        invitationExpiresAt: { type: string, format: date-time }
    MyWorkerInvitationResponse:
      type: object
      required: [invitation]
      properties:
        invitation:
          oneOf:
            - $ref: "#/components/schemas/MyWorkerInvitationPreview"
            - type: "null"
    CompanyOption:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    WorkerCompanyRequestInput:
      type: object
      required: [companyId]
      properties:
        companyId: { type: integer, minimum: 1 }
    WorkerCompanyRequest:
      type: object
      required: [id, companyId, companyName, status, createdAt]
      properties:
        id: { type: integer }
        companyId: { type: integer }
        companyName: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
